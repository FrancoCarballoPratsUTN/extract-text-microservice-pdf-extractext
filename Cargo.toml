[package]
name = "extract"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64-simd = "0.8.0"
lopdf = "0.45.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
